services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: shopping-app-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: "Developer"
    ports:
      - "127.0.0.1:1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\")"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - app-network
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: shopping-app-mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Set MONGO_INITDB_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network
    restart: unless-stopped

  server-net:
    build:
      context: ./server-net
      dockerfile: Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ShoppingAppDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5177:8080"
    networks:
      - app-network
    restart: unless-stopped

  server-node:
    build:
      context: ./server-node
      dockerfile: Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
      server-net:
        condition: service_started
    environment:
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/orders?authSource=admin
      CATALOG_API_URL: http://server-net:8080/api
      PORT: 5000
      NODE_ENV: production
      PUBLIC_URL: http://localhost:5001
    ports:
      - "5001:5000"
    networks:
      - app-network
    restart: unless-stopped

  app:
    build:
      context: ./shopping-client
      dockerfile: Dockerfile
      args:
        VITE_API_PRODUCTS: http://localhost:5177/api/
        VITE_API_ORDERS: http://localhost:5001/api/
    ports:
      - "5173:5173"
    networks:
      - app-network
    restart: unless-stopped

volumes:
  sqlserver-data:
  mongo-data:

networks:
  app-network:
    driver: bridge
