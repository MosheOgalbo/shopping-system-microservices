name: tests

on:
  push:
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test server-net/ShoppingApp.sln --configuration Release

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server-node/package-lock.json
      - run: npm ci
        working-directory: server-node
      - run: npm run build
        working-directory: server-node
      - run: npm test
        working-directory: server-node

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shopping-client/package-lock.json
      - run: npm ci
        working-directory: shopping-client
      - run: npm run lint
        working-directory: shopping-client
      - run: npm run build
        working-directory: shopping-client
      - run: npm test
        working-directory: shopping-client

  e2e:
    runs-on: ubuntu-latest
    needs: [dotnet, node, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Start stack
        run: docker compose up --build -d
      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5177/health \
              && curl -sf http://localhost:5001/health \
              && curl -sf http://localhost:5173 >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - name: Stop stack
        if: always()
        run: docker compose down -v
