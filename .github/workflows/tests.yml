name: tests

on:
  push:
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test server-net/ShoppingApp.sln --configuration Release

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server-node/package-lock.json
      - run: npm ci
        working-directory: server-node
      - run: npm test
        working-directory: server-node

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shopping-client/package-lock.json
      - run: npm ci
        working-directory: shopping-client
      - run: npm test
        working-directory: shopping-client
