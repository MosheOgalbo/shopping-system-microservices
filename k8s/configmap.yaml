apiVersion: v1
kind: ConfigMap
metadata:
  name: freshcart-config
  namespace: freshcart
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  PORT: "5000"
  CATALOG_API_URL: "http://server-net:8080/api"
  # Comma-separated browser origins when APIs are called cross-origin.
  # Same-origin Ingress (/api) usually does not need extras.
  Cors__AllowedOrigins: "http://localhost:5173,http://127.0.0.1:5173"
  CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
