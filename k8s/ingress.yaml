apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: freshcart
  namespace: freshcart
  annotations:
    # Local/default: nginx ingress controller.
    # For AWS ALB, see aws/ingress-alb.yaml.
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
spec:
  ingressClassName: nginx
  rules:
    - host: freshcart.local
      http:
        paths:
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: server-node
                port:
                  number: 5000
          - path: /api/Products
            pathType: Prefix
            backend:
              service:
                name: server-net
                port:
                  number: 8080
          - path: /api/Categories
            pathType: Prefix
            backend:
              service:
                name: server-net
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 5173
