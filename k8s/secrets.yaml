apiVersion: v1
kind: Secret
metadata:
  name: freshcart-secrets
  namespace: freshcart
type: Opaque
stringData:
  # Demo-only credentials. Replace before any shared/cloud environment.
  MSSQL_SA_PASSWORD: "YourStrongPassword123!"
  MONGO_ROOT_USERNAME: "root"
  MONGO_ROOT_PASSWORD: "example"
  ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ShoppingAppDb;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;Encrypt=True"
  MONGO_URI: "mongodb://root:example@mongo:27017/orders?authSource=admin"
