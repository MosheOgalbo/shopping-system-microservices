apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-node
  namespace: freshcart
  labels:
    app: server-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server-node
  template:
    metadata:
      labels:
        app: server-node
    spec:
      containers:
        - name: server-node
          image: freshcart/server-node:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: freshcart-config
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: freshcart-secrets
                  key: MONGO_URI
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: server-node
  namespace: freshcart
spec:
  selector:
    app: server-node
  ports:
    - name: http
      port: 5000
      targetPort: 5000
