apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: freshcart
resources:
  - namespace.yaml
  - secrets.yaml
  - configmap.yaml
  - sqlserver.yaml
  - mongo.yaml
  - server-net.yaml
  - server-node.yaml
  - app.yaml
  - ingress.yaml
images:
  - name: freshcart/server-net
    newName: freshcart/server-net
    newTag: latest
  - name: freshcart/server-node
    newName: freshcart/server-node
    newTag: latest
  - name: freshcart/app
    newName: freshcart/app
    newTag: latest
