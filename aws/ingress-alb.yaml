apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: freshcart
  namespace: freshcart
  annotations:
    kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: server-node
                port:
                  number: 5000
          - path: /api/Products
            pathType: Prefix
            backend:
              service:
                name: server-net
                port:
                  number: 8080
          - path: /api/Categories
            pathType: Prefix
            backend:
              service:
                name: server-net
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 5173
