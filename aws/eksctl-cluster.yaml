# Create with: eksctl create cluster -f aws/eksctl-cluster.yaml
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: freshcart
  region: eu-west-1
  version: "1.30"

iam:
  withOIDC: true

managedNodeGroups:
  - name: freshcart-nodes
    instanceType: t3.xlarge
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    volumeSize: 40
    privateNetworking: true
    iam:
      withAddonPolicies:
        albIngress: true
        cloudWatch: true
        ebs: true

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver
